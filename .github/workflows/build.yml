name: GitHub CI
on:
  push:
  pull_request:
  release:
    types: released

jobs:
  build-dotnet-core:
    name: Build .Net Core
    runs-on: ubuntu-latest

    strategy:
      matrix:
        configuration: [ Release ]
        runtime-identifier: [ 'win-x64', 'win-x86', 'linux-x64', 'osx-x64', 'osx-arm64' ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET Core SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Publish the application
        run: dotnet publish de4dot --configuration ${{ matrix.configuration }} -f net8.0 --runtime ${{ matrix.runtime-identifier }} --self-contained false -p:PublishSingleFile=true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: de4dot-net8.0-${{ matrix.runtime-identifier }}
          path: |
            ${{ matrix.configuration }}/net8.0/${{ matrix.runtime-identifier }}/publish/
            !${{ matrix.configuration }}/net8.0/${{ matrix.runtime-identifier }}/publish/*.pdb
